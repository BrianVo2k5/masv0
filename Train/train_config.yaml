# train_config.yaml — optimized for Apple M1 (MPS)

model:
  model_id: "allenai/led-base-16384"
  torch_dtype: "float16" # Use float16 to reduce memory footprint on M1

dataset:
  name: "abisee/cnn_dailymail"
  version: "3.0.0"
  train_split: "train"
  val_split: "validation"
  text_column: "article"     # CRITICAL FIX: Changed from "document"
  summary_column: "highlights" # CRITICAL FIX: Changed from "summary"
  max_input_len: 1024
  max_target_len: 48
  num_workers: 2             # Reduced to 2 to prevent M1 memory thrashing
  max_eval_samples: 1000

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
    - "fc1"
    - "fc2"

training:
  output_dir: "./runs/led-lora-cnn" # Updated to reflect actual model/dataset
  num_train_epochs: 3
  per_device_train_batch_size: 2    # Kept low (2) to avoid M1 unified memory Out-Of-Memory (OOM) errors
  gradient_accumulation_steps: 32   # Increased to 32 to maintain a solid effective batch size (64)
  per_device_eval_batch_size: 4     # Lowered to 4 for evaluation memory stability
  learning_rate: 2.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  weight_decay: 0.01
  label_smoothing_factor: 0.0  # LabelSmoother gets labels padded to encoder length (1024) but logits are decoder length (48) → shape crash
  bf16: false
  fp16: false                       # MPS does not support CUDA AMP (torch.cuda.amp); model weights in float16 still reduce memory
  dataloader_pin_memory: false      # Must be false; pin_memory is for CUDA only
  dataloader_num_workers: 0         # MPS tensors in DataCollatorForSeq2Seq cannot be serialized for worker IPC
  group_by_length: true
  eval_strategy: "epoch"
  predict_with_generate: true
  generation_max_length: 48
  eval_accumulation_steps: 4        # Mitigates CPU-to-GPU memory spikes during eval generation
  logging_steps: 50
  seed: 42

checkpointing:
  save_steps: 200
  keep_last_n_steps: 5
  save_at_epoch_end: true