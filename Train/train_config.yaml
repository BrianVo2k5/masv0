# train_config.yaml — optimized for Apple M1 (MPS)

model:
  model_id: "allenai/led-base-16384"
  torch_dtype: "float16" # native MPS fp16 — model weights and fwd/bwd in fp16 on MPS; no CUDA AMP needed

dataset:
  name: "abisee/cnn_dailymail"
  version: "3.0.0"
  train_split: "train"
  val_split: "validation"
  text_column: "article"     # CRITICAL FIX: Changed from "document"
  summary_column: "highlights" # CRITICAL FIX: Changed from "summary"
  max_input_len: 1024
  max_target_len: 48
  num_workers: 2             # Reduced to 2 to prevent M1 memory thrashing
  max_eval_samples: 1000

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
    - "fc1"
    - "fc2"

training:
  output_dir: "./runs/led-lora-cnn" # Updated to reflect actual model/dataset
  num_train_epochs: 3
  per_device_train_batch_size: 2    # keep low for M1 unified memory
  gradient_accumulation_steps: 16   # effective batch = 32; fewer steps reduces fp16 rounding accumulation vs 32
  per_device_eval_batch_size: 4
  learning_rate: 5.0e-5
  max_grad_norm: 0.3                # tighter than default 1.0 — fp16 has no loss scaling so clipping is the only guard
  lr_scheduler_type: "cosine"
  warmup_steps: 1000                # longer warmup keeps lr low during the noisiest early steps
  weight_decay: 0.01
  label_smoothing_factor: 0.0  # LabelSmoother gets labels padded to encoder length (1024) but logits are decoder length (48) → shape crash
  bf16: false
  fp16: false                       # MPS does not support CUDA AMP (torch.cuda.amp)
  dataloader_pin_memory: false      # Must be false; pin_memory is for CUDA only
  dataloader_num_workers: 0         # MPS tensors in DataCollatorForSeq2Seq cannot be serialized for worker IPC
  group_by_length: true
  eval_strategy: "epoch"
  predict_with_generate: true
  generation_max_length: 128
  eval_accumulation_steps: 4        # Mitigates CPU-to-GPU memory spikes during eval generation
  logging_steps: 50
  seed: 42

checkpointing:
  save_steps: 200
  keep_last_n_steps: 5
  save_at_epoch_end: true