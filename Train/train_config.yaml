# train_config.yaml — edit this, training.py reads it at startup

model:
  model_id: "facebook/bart-large"
  torch_dtype: "bfloat16"

dataset:
  name: "xsum"
  train_split: "train"
  val_split: "validation"
  text_column: "document"
  summary_column: "summary"
  max_input_len: 1024
  max_target_len: 48
  num_workers: 4
  max_eval_samples: 1000

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
    - "fc1"
    - "fc2"

training:
  output_dir: "./runs/bart-lora-xsum"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  per_device_eval_batch_size: 8
  learning_rate: 2.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  weight_decay: 0.01
  label_smoothing_factor: 0.1
  bf16: false
  fp16: false
  dataloader_pin_memory: false
  dataloader_num_workers: 0
  group_by_length: true
  eval_strategy: "epoch"
  predict_with_generate: true
  generation_max_length: 48
  eval_accumulation_steps: 8
  logging_steps: 50
  seed: 42

checkpointing:
  save_steps: 200
  keep_last_n_steps: 3
  save_at_epoch_end: true